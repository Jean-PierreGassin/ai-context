<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --text: #1a1f36;
    --muted: #697386;
    --border: #e3e8ee;
    --link: #635bff;
    --error: #df1b41;
    --error-soft: #fff1f3;
    --error-line: #f4a8b8;
    --warning: #c47800;
    --warning-soft: #fffaeb;
    --warning-line: #f5be58;
    --info: #3d6fd8;
    --info-soft: #f0f5ff;
    --info-line: #a8c2f4;
    --success: #1a7f4b;
    --success-soft: #effaf3;
    --success-line: #9bd9b5;
    --code-bg: #1a1f36;
    --code-head: #2a2f45;
    --code-text: #c1c9d2;
  }
</style>
<style>{{BRAND_CSS}}</style>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--text); font: 16px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font: 14px/1.5 var(--mono); background: #f6f8fa; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .page { max-width: 1680px; margin: 0 auto; padding: 40px 56px 72px; }
  .crumb { font-size: 14px; color: var(--muted); }
  h1 { margin: 6px 0 20px; font-size: 30px; line-height: 1.25; font-weight: 600; letter-spacing: -.01em; }
  h2 { margin: 0 0 6px; font-size: 19px; line-height: 1.35; font-weight: 600; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: 14px; }
  .icon { flex: none; width: 20px; height: 20px; }
  .k-critical { --tone: var(--error); --tone-soft: var(--error-soft); --tone-line: var(--error-line); }
  .k-decision { --tone: var(--warning); --tone-soft: var(--warning-soft); --tone-line: var(--warning-line); }
  .k-structure { --tone: var(--info); --tone-soft: var(--info-soft); --tone-line: var(--info-line); }
  .k-none { --tone: var(--success); --tone-soft: var(--success-soft); --tone-line: var(--success-line); }
  .icon { color: var(--tone); }

  .verdict { display: flex; gap: 12px; align-items: flex-start; width: fit-content; max-width: 100%; border: 1px solid var(--tone-line); background: var(--tone-soft); border-radius: 8px; padding: 14px 16px; }
  .verdict .icon { margin-top: 2px; }
  .verdict b { display: block; }
  .draft { margin-top: 10px; font-size: 14px; color: var(--error); }

  section.why { max-width: 1100px; padding: 32px 0 8px; }
  .issue { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 32px 0; border-top: 1px solid var(--border); }
  .issue > div:first-child { max-width: 1000px; }
  .code-pair { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
  aside.comment { position: sticky; top: 16px; border: 1px solid var(--tone-line); background: var(--tone-soft); border-radius: 10px; padding: 12px 14px; font-size: 14.5px; }
  aside.comment .comment-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  aside.comment b { display: block; font-size: 14px; }
  aside.comment .comment-top > div { min-width: 0; }
  aside.comment span { display: block; font: 12px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside.comment p { margin: 0; }
  aside.comment .copy { background: var(--link); border-color: var(--link); color: #fff; }
  .issue:first-of-type { margin-top: 24px; }
  .kind { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--tone); margin-bottom: 8px; }
  .kind .icon { width: 18px; height: 18px; }
  .visual { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; min-width: 0; }

  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  figure { margin: 0; min-width: 0; }
  figure button { display: block; width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: #fff; cursor: zoom-in; }
  figure.head button { border-color: var(--tone-line); box-shadow: 0 0 0 1px var(--tone-line); }
  figure img, figure video { display: block; width: 100%; height: auto; }
  figcaption { margin-top: 6px; font-size: 13px; color: var(--muted); }
  figcaption b { color: var(--text); font-weight: 600; }

  .code { background: var(--code-bg); border-radius: 8px; overflow: hidden; font: 13px/1.7 var(--mono); color: var(--code-text); }
  .code .file { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 12px; background: var(--code-head); color: #a3acb9; padding: 6px 12px 0; font-size: 12.5px; }
  .code .also { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 7px 16px; border-top: 1px solid #2a2f45; font: 12px var(--mono); }
  .code .also .label-also { font: 600 12px var(--font); color: #8792a2; }
  .code .also a, .code .also span { color: #a3acb9; }
  .code .also a:hover { color: #fff; }
  .code .path { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 16px; padding: 9px 16px; background: var(--code-head); color: #a3acb9; font-size: 12.5px; }
  .code .path > span:first-child { overflow-wrap: anywhere; min-width: 0; }
  .code .links { white-space: nowrap; color: #8792a2; }
  .code .links a { color: #a3acb9; }
  .code .links a:hover { color: #fff; }
  .code pre { margin: 0; padding: 10px 0; overflow-x: auto; }
  .code a.open { display: block; color: inherit; text-decoration: none; cursor: pointer; }
  .code a.open:hover pre { background: rgba(255, 255, 255, .03); }
  .code a.open:hover { text-decoration: none; }
  .code .l { display: grid; grid-template-columns: 44px 16px minmax(0, 1fr); padding: 0 16px; white-space: pre-wrap; overflow-wrap: break-word; }
  .code .n { color: #4f566b; user-select: none; }
  .code .s { user-select: none; font-weight: 700; }
  .code .l.add { background: rgba(46, 160, 67, .08); box-shadow: inset 3px 0 0 rgba(63, 185, 80, .55); }
  .code .l.add .s { color: #3fb950; }
  .code .l.del { background: rgba(248, 81, 73, .08); box-shadow: inset 3px 0 0 rgba(248, 81, 73, .55); }
  .code .l.del .c { text-decoration: line-through; text-decoration-color: rgba(248, 81, 73, .5); opacity: .75; }
  .code .l.del .s { color: #f85149; }
  .code .l.hit { position: relative; background: rgba(245, 190, 88, .22); box-shadow: inset 4px 0 0 #f5be58; outline: 1px solid rgba(245, 190, 88, .45); outline-offset: -1px; }
  .code .l.hit .n { color: #f5be58; font-weight: 700; }
  .code .l.hit::after { content: "◀"; position: absolute; right: 10px; top: 0; color: #f5be58; font-size: 11px; }
  .code .c { color: #d7dce4; }
  .code .tk { color: #c792ea; }
  .code .tv { color: #f07178; }
  .code .ts { color: #c3e88d; }
  .code .tn { color: #f78c6c; }
  .code .tf { color: #82aaff; }
  .code .tt { color: #ffcb6b; }
  .code .tp { color: #89ddff; }
  .code .tc { color: #697098; font-style: italic; }
  .code .gap { color: #4f566b; padding: 0 16px 0 76px; }
  .code .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; padding: 7px 16px 9px; border-top: 1px solid #2a2f45; font: 12px var(--font); color: #8792a2; }
  .code .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 6px; }
  .code .legend .add { background: rgba(46, 160, 67, .3); box-shadow: inset 3px 0 0 #3fb950; }
  .code .legend .del { background: rgba(248, 81, 73, .3); box-shadow: inset 3px 0 0 #f85149; }
  .code .legend .hit { background: rgba(245, 190, 88, .4); box-shadow: inset 3px 0 0 #f5be58; }
  .code .note { padding: 8px 16px 10px; border-top: 1px solid #2a2f45; color: #a3acb9; font: 13px/1.5 var(--font); }

  .copy { border: 1px solid var(--border); background: #fff; border-radius: 6px; padding: 3px 10px; font: 600 13px var(--font); color: var(--text); cursor: pointer; }
  .copy:hover { border-color: var(--link); color: var(--link); }

  .zoom { position: fixed; inset: 0; background: rgba(26, 31, 54, .7); display: none; place-items: center; padding: 32px; cursor: zoom-out; z-index: 10; }
  .zoom.open { display: grid; }
  .zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; background: #fff; }

  .shots { max-width: 900px; }

  @media (max-width: 1100px) {
    .code-pair { grid-template-columns: minmax(0, 1fr); }
    aside.comment { position: static; }
  }

  @media (max-width: 860px) {
    .page { padding: 24px 16px 48px; }
    h1 { font-size: 24px; }
    .issue { grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .code .l { grid-template-columns: 40px minmax(0, 1fr); white-space: pre-wrap; overflow-wrap: anywhere; }
  }
</style>
</head>
<body>
<main class="page" id="page"></main>
<div class="zoom" id="zoom"><img alt=""></div>

<script type="application/json" id="report-data">{{REPORT_JSON}}</script>
<script>
(() => {
  const report = JSON.parse(document.getElementById('report-data').textContent);
  const pull = report.pull;
  const isSelf = report.mode === 'self';
  const baseName = pull.base ?? 'the base';
  const headName = isSelf ? 'your change' : 'this PR';
  const kindNames = { critical: 'Critical', decision: isSelf ? 'Check the scope' : 'Needs an answer', structure: 'Code quality' };
  const kindOrder = { critical: 0, decision: 1, structure: 2 };
  const ran = (flag) => (flag.evidence.some((evidence) => evidence.kind === 'ran') ? 0 : 1);
  const flags = report.flags
    .map((flag, index) => ({ ...flag, number: flag.number ?? index + 1 }))
    .sort((first, second) => kindOrder[first.kind] - kindOrder[second.kind] || ran(first) - ran(second) || first.number - second.number);
  const icons = {
    critical: '<path d="M10 1.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17Zm3.03 10.47a.75.75 0 1 1-1.06 1.06L10 11.06l-1.97 1.97a.75.75 0 1 1-1.06-1.06L8.94 10 6.97 8.03a.75.75 0 0 1 1.06-1.06L10 8.94l1.97-1.97a.75.75 0 1 1 1.06 1.06L11.06 10l1.97 1.97Z"/>',
    decision: '<path d="M8.48 2.46a1.75 1.75 0 0 1 3.04 0l6.6 11.55A1.75 1.75 0 0 1 16.6 16.6H3.4a1.75 1.75 0 0 1-1.52-2.6l6.6-11.54ZM10 6.5a.75.75 0 0 0-.75.75v3.5a.75.75 0 0 0 1.5 0v-3.5A.75.75 0 0 0 10 6.5Zm0 7.75a.9.9 0 1 0 0-1.8.9.9 0 0 0 0 1.8Z"/>',
    structure: '<path d="M10 1.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17Zm0 4a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8Zm.75 8.75a.75.75 0 0 1-1.5 0v-4.5a.75.75 0 0 1 1.5 0v4.5Z"/>',
    none: '<path d="M10 1.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17Zm3.78 6.28-4.5 4.5a.75.75 0 0 1-1.06 0l-2-2a.75.75 0 1 1 1.06-1.06l1.47 1.47 3.97-3.97a.75.75 0 1 1 1.06 1.06Z"/>',
  };

  function el(tag, className, text) {
    const node = document.createElement(tag);

    if (className) {
      node.className = className;
    }

    if (text !== undefined && text !== null) {
      String(text).split(/(`[^`]+`|\[[^\]]+\]\(https?:\/\/[^)\s]+\))/).forEach((part) => {
        const link = part.match(/^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)$/);

        if (link) {
          const anchor = el('a', '', link[1]);
          anchor.href = link[2];
          anchor.target = '_blank';
          anchor.rel = 'noopener';
          node.append(anchor);
        } else if (part.length > 1 && part.startsWith('`') && part.endsWith('`')) {
          node.append(el('code', '', part.slice(1, -1)));
        } else if (part) {
          node.append(document.createTextNode(part));
        }
      });
    }

    return node;
  }

  function icon(kind) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'icon');
    svg.setAttribute('viewBox', '0 0 20 20');
    svg.setAttribute('fill', 'currentColor');
    svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = icons[kind];

    return svg;
  }

  function anchor(text, href) {
    const link = el('a', '', text);
    link.href = href;
    link.target = '_blank';
    link.rel = 'noopener';

    return link;
  }

  function plural(count, word) {
    return `${count} ${word}${count === 1 ? '' : 's'}`;
  }

  function copyButton(text) {
    const button = el('button', 'copy', 'Copy');
    button.type = 'button';
    button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const area = document.createElement('textarea');
        area.value = text;
        document.body.append(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }

      button.textContent = 'Copied';
      setTimeout(() => { button.textContent = 'Copy'; }, 1400);
    });

    return button;
  }

  function verification(flag) {
    const sides = new Set(flag.evidence.filter((evidence) => evidence.kind === 'ran').map((evidence) => evidence.side));

    if (sides.size === 2) {
      return `Ran on ${baseName} and on ${headName}.`;
    }

    if (sides.size) {
      return `Ran on ${sides.has('base') ? baseName : headName}.`;
    }

    if (flag.evidence.some((evidence) => evidence.kind === 'read')) {
      return 'Read in the code.';
    }

    return 'From the ticket and docs.';
  }

  const page = document.getElementById('page');
  const crumb = el('div', 'crumb');

  if (isSelf) {
    crumb.append(document.createTextNode(`Self-review${pull.repository ? ` · ${pull.repository}` : ''}${pull.branch ? ` · ${pull.branch} → ${baseName}` : ''}`));
  } else {
    crumb.append(anchor(`${pull.repository} #${pull.number}`, pull.url));
    const bits = [pull.ticket?.key, pull.author ? `by ${pull.author}` : null, pull.ci ? `CI ${pull.ciLabel ?? pull.ci}` : null].filter(Boolean);

    if (bits.length) {
      crumb.append(document.createTextNode(` · ${bits.join(' · ')}`));
    }
  }

  page.append(crumb, el('h1', '', pull.title));

  const counts = { critical: 0, decision: 0, structure: 0 };
  flags.forEach((flag) => { counts[flag.kind] += 1; });
  const worst = counts.critical ? 'critical' : counts.decision ? 'decision' : counts.structure ? 'structure' : 'none';
  const ciWaiting = pull.ci === 'fail' || pull.ci === 'pending';
  const headline = {
    critical: isSelf ? 'Fix before review.' : 'Don\'t merge yet.',
    decision: isSelf ? 'Check the scope before review.' : 'Not ready to merge yet.',
    structure: isSelf ? 'Ready for review.' : ciWaiting ? 'Safe to merge once CI passes.' : 'Safe to merge.',
    none: isSelf ? 'Ready for review.' : ciWaiting ? 'Safe to merge once CI passes.' : 'Safe to merge.',
  }[worst];
  const parts = [];

  if (counts.critical) {
    parts.push(`${plural(counts.critical, 'critical issue')} to fix`);
  } else {
    parts.push('No bugs found');
  }

  if (counts.decision) {
    parts.push(isSelf ? `${plural(counts.decision, 'change')} to check against the goal` : `${counts.decision} ${counts.decision === 1 ? 'thing needs' : 'things need'} an answer from the author first`);
  }

  if (counts.structure) {
    parts.push(`${plural(counts.structure, 'code quality note')}`);
  }

  const verdict = el('div', `verdict k-${worst}`);
  const verdictText = el('div');
  verdictText.append(el('b', '', headline), document.createTextNode(`${parts.join('. ')}.`));
  verdict.append(icon(worst), verdictText);
  page.append(verdict);

  if (report.audit?.state !== 'audited') {
    page.append(el('div', 'draft', 'Draft: the claims on this page have not been checked yet.'));
  }

  if (report.tldr?.length) {
    const why = el('section', 'why');
    why.append(el('h2', '', 'Why this change'));
    report.tldr.forEach((paragraph) => why.append(el('p', '', paragraph)));
    page.append(why);
  }

  function legend() {
    const row = el('div', 'legend');
    const key = (className, text) => {
      const item = el('span');
      item.append(el('i', className), document.createTextNode(text));

      return item;
    };
    row.append(key('add', `+ added by ${isSelf ? 'your change' : 'this PR'}`), key('del', `− removed (what ${baseName} has)`), key('hit', '◀ the problem line'));

    return row;
  }

  const zoom = document.getElementById('zoom');
  zoom.addEventListener('click', () => zoom.classList.remove('open'));
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      zoom.classList.remove('open');
    }
  });

  function shots(flag) {
    const pair = el('div', 'shots');
    const rank = (item) => (item.side === 'base' ? 0 : 1);
    [...flag.media].sort((first, second) => rank(first) - rank(second)).forEach((item) => {
      const figure = el('figure', item.side);
      const frame = el('button');
      frame.type = 'button';
      frame.title = 'Open the full screenshot';

      if (item.kind === 'video') {
        const video = el('video');
        video.src = item.src;
        video.controls = true;
        video.muted = true;
        frame.append(video);
      } else {
        const image = el('img');
        image.src = item.thumb ?? item.src;
        image.alt = item.caption;
        frame.append(image);
        frame.addEventListener('click', () => {
          zoom.querySelector('img').src = item.src;
          zoom.classList.add('open');
        });
      }

      const caption = el('figcaption');
      caption.append(el('b', '', item.side === 'base' ? baseName.charAt(0).toUpperCase() + baseName.slice(1) : (isSelf ? 'Your change' : 'This PR')), document.createTextNode(` · ${item.caption}`));
      figure.append(frame, caption);
      pair.append(figure);
    });

    return pair;
  }

  function lineRange(location) {
    return location.to && location.to !== location.line ? `${location.line}-${location.to}` : `${location.line}`;
  }

  function locationLinks(location) {
    const links = el('span', 'links');

    if (location.editorUrl) {
      const open = el('a', '', 'Open in editor');
      open.href = location.editorUrl;
      links.append(open);
    } else if (report.editor) {
      const missing = el('span', '', 'Not in your checkout');
      missing.title = 'This code is not in any local checkout. Check out the branch to open it in your editor.';
      links.append(missing);
    }

    const web = location.diffUrl ? anchor('View in PR', location.diffUrl) : location.fileUrl ? anchor('View file', location.fileUrl) : null;

    if (web) {
      links.append(document.createTextNode(links.childNodes.length ? ' · ' : ''), web);
    }

    return links;
  }

  const keywords = new Set(['abstract', 'and', 'array', 'as', 'async', 'await', 'break', 'case', 'catch', 'class', 'clone', 'const', 'continue', 'declare', 'default', 'do', 'echo', 'else', 'elseif', 'enum', 'export', 'extends', 'false', 'final', 'finally', 'fn', 'for', 'foreach', 'from', 'function', 'if', 'implements', 'import', 'in', 'instanceof', 'interface', 'let', 'match', 'namespace', 'new', 'null', 'or', 'private', 'protected', 'public', 'readonly', 'return', 'self', 'static', 'switch', 'this', 'throw', 'trait', 'true', 'try', 'use', 'var', 'void', 'while', 'yield', 'string', 'int', 'bool', 'float', 'mixed', 'iterable', 'object', 'never', 'list']);
  const token = /(\/\/.*$|#.*$|\/\*.*?(?:\*\/|$)|^\s*\*.*$)|('(?:\\.|[^'\\])*'?|"(?:\\.|[^"\\])*"?|`(?:\\.|[^`\\])*`?)|(\$[A-Za-z_]\w*)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w\\]*)(?=\s*\()|(\b[A-Z][\w\\]*)|([A-Za-z_]\w*)/gm;

  function highlight(text) {
    const parts = [];
    let last = 0;

    for (const match of text.matchAll(token)) {
      if (match.index > last) {
        parts.push(document.createTextNode(text.slice(last, match.index)));
      }

      const [whole, comment, string, variable, number, call, type, word] = match;
      let kind = '';

      if (comment) {
        kind = 'tc';
      } else if (string) {
        kind = 'ts';
      } else if (variable) {
        kind = 'tv';
      } else if (number) {
        kind = 'tn';
      } else if (call) {
        kind = keywords.has(call.toLowerCase()) ? 'tk' : 'tf';
      } else if (type) {
        kind = 'tt';
      } else if (word && keywords.has(word.toLowerCase())) {
        kind = 'tk';
      }

      const before = text.slice(0, match.index);

      if (!kind && word && /->\s*$|::\s*$/.test(before)) {
        kind = 'tp';
      }

      const span = document.createElement('span');
      span.className = kind;
      span.textContent = whole;
      parts.push(kind ? span : document.createTextNode(whole));
      last = match.index + whole.length;
    }

    if (last < text.length) {
      parts.push(document.createTextNode(text.slice(last)));
    }

    return parts;
  }

  function diff(location) {
    const pre = el('pre');
    const rows = location.rows;
    const hits = rows.map((row, index) => (row.focus ? index : -1)).filter((index) => index >= 0);
    const from = Math.max(0, (hits[0] ?? 0) - 3);
    const to = Math.min(rows.length, (hits[hits.length - 1] ?? 0) + 4);
    const shown = rows.slice(from, to);
    const indent = Math.min(...shown.filter((row) => row.type !== 'gap' && row.text.trim()).map((row) => row.text.match(/^\s*/)[0].length));
    shown.forEach((row) => {
      if (row.type === 'gap') {
        pre.append(el('span', 'gap', '⋯'));

        return;
      }

      const line = el('span', `l ${row.type}${row.focus ? ' hit' : ''}`);
      line.append(el('span', 'n', row.new ?? ''), el('span', 's', row.type === 'add' ? '+' : row.type === 'del' ? '−' : ''));
      const code = el('span', 'c');
      code.append(...highlight(row.text.slice(Number.isFinite(indent) ? indent : 0)));
      line.append(code);
      pre.append(line);
    });

    if (!location.editorUrl) {
      return pre;
    }

    const open = el('a', 'open');
    open.href = location.editorUrl;
    open.title = `Open ${location.path} at line ${location.line} in your editor`;
    open.append(pre);

    return open;
  }

  function codeTabs(locations) {
    const [main, ...others] = locations;
    const block = el('div', 'code');
    const path = el('div', 'path');
    path.append(el('span', '', `${main.path}:${lineRange(main)}`), locationLinks(main));
    block.append(path, diff(main));

    if (others.length) {
      const also = el('div', 'also');
      also.append(el('span', 'label-also', 'Also in'));
      others.forEach((location) => {
        const text = `${location.file}:${lineRange(location)}`;
        const link = location.editorUrl ? el('a', '', text) : location.diffUrl ? anchor(text, location.diffUrl) : el('span', '', text);

        if (location.editorUrl) {
          link.href = location.editorUrl;
        }

        link.title = location.note ? `${location.path}: ${location.note}` : location.path;
        also.append(link);
      });
      block.append(also);
    }

    block.append(legend());

    return block;
  }

  flags.forEach((flag) => {
    const row = el('section', `issue k-${flag.kind}`);
    row.id = `issue-${flag.number}`;
    const text = el('div');
    const kind = el('div', 'kind');
    kind.append(icon(flag.kind), document.createTextNode(kindNames[flag.kind]));
    text.append(kind, el('h2', '', flag.headline), el('p', '', flag.summary));

    text.append(el('p', 'muted', verification(flag)));
    const visual = el('div', 'visual');

    if (flag.media?.length) {
      visual.append(shots(flag));
    }

    if (flag.code?.length) {
      const pair = el('div', 'code-pair');
      pair.append(codeTabs(flag.code));

      if (flag.comment) {
        const note = el('aside', 'comment');
        const head = el('div', 'comment-top');
        const title = el('div');
        const target = flag.commentAt ? `${flag.commentAt.file}:${flag.commentAt.line}` : flag.code[0].file;
        const where = el('span', '', flag.commentAt?.inDiff === false ? `${target} · goes in the review body` : target);
        where.title = where.textContent;
        title.append(el('b', '', isSelf ? 'Fix' : 'Comment'), where);
        head.append(title, copyButton(flag.comment));
        note.append(head, el('p', '', flag.comment));
        pair.append(note);
      }

      visual.append(pair);
    }

    row.append(text, visual);
    page.append(row);
  });

})();
</script>
</body>
</html>
